version: '3.8'

services:
  theta-x-assistant:
    build: .
    container_name: theta_x_app
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_THEME_BASE=dark  # Forces dark mode to match your screenshot
    volumes:
      - .:/app
    restart: always

# Optional: define a network if you plan to connect to a database container later
networks:
  default:
    name: theta-x-network